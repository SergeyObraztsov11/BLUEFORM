name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server
      - name: Check formatting, lint and types
        run: npm run verify
      - name: Check catalog pricing
        run: node --test directus/extensions/blueform-catalog/tests/pricing.test.ts
      - name: Build applications
        env:
          DATABASE_URL: postgresql://localhost:5432/blueform
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
        run: npm run build
      - name: Start isolated test services
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-only-postgres-password
          S3_ACCESS_KEY_ID=blueform-ci
          S3_SECRET_ACCESS_KEY=ci-only-s3-password
          BETTER_AUTH_SECRET=ci-only-secret-with-at-least-32-characters
          EOF
          docker compose up -d --build --wait --wait-timeout 240
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/account >/dev/null; then exit 0; fi
            sleep 3
          done
          echo 'Nuxt did not become ready in time.'
          exit 1
      - name: Run API and authentication checks
        run: |
          npm run test:contract
          docker compose exec -T -e BLUEFORM_ALLOW_AUTH_TEST=1 web node_modules/.bin/tsx --test ../server/tests/auth-flow.test.ts
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100
