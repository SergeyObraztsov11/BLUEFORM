services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://blueform:${POSTGRES_PASSWORD}@db:5432/blueform?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes:
      - ./server/src:/app/server/src
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
      - ./shared:/app/shared:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    working_dir: /app/client
    command: sh -c "npx prisma migrate deploy && npx prisma generate --generator client && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://blueform:${POSTGRES_PASSWORD}@db:5432/blueform?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
      NUXT_API_INTERNAL_URL: http://api:3001
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: blueform
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - .:/app
      - web_node_modules:/app/client/node_modules
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mailpit:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blueform
      POSTGRES_USER: blueform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueform -d blueform"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: blueform
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  web_node_modules:
  postgres_data:
  s3_data:
