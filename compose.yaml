services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      PORT: '3001'
      DATABASE_URL: postgresql://blueform:${POSTGRES_PASSWORD}@db:5432/blueform?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes:
      - directus_shop_uploads:/directus-uploads:ro
      - ./server/src:/app/server/src
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
      - ./shared:/app/shared:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    working_dir: /app/client
    command: sh -c "node scripts/ensure-deps.ts && npx prisma migrate deploy && npx prisma generate --generator client && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://blueform:${POSTGRES_PASSWORD}@db:5432/blueform?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
      NUXT_API_INTERNAL_URL: http://api:3001
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: blueform
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      OWNER_NOTIFY_EMAIL: ${OWNER_NOTIFY_EMAIL:-admin@blueform.local}
    volumes:
      - .:/app
      - web_node_modules:/app/client/node_modules
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mailpit:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blueform
      POSTGRES_USER: blueform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blueform -d blueform']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: blueform
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  directus-db:
    profiles: [observability]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DIRECTUS_DB_PASSWORD:-local-only-directus-db}
    volumes:
      - directus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U directus -d directus']
      interval: 5s
      timeout: 5s
      retries: 12

  directus:
    profiles: [observability]
    image: directus/directus:11.14.1
    ports:
      - '127.0.0.1:8055:8055'
    environment:
      SECRET: ${DIRECTUS_SECRET:-local-only-change-directus-secret-please}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-BlueformLocal123!}
      DB_CLIENT: pg
      DB_HOST: directus-db
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-local-only-directus-db}
      PUBLIC_URL: http://localhost:8055
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      directus-db:
        condition: service_healthy

  directus-shop-init:
    profiles: [admin]
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGDATABASE: blueform
      PGUSER: blueform
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DIRECTUS_SHOP_DB_PASSWORD: ${DIRECTUS_SHOP_DB_PASSWORD:-local-only-directus-shop-password}
    volumes:
      - ./scripts/directus-shop-init.sql:/directus-shop-init.sql:ro
      - ./scripts/directus-shop-check.sql:/directus-shop-check.sql:ro
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for attempt in $$(seq 1 120); do
          if [ "$$(psql -Atqc "SELECT count(*) FROM _prisma_migrations WHERE migration_name = '20261106100000_directus_media' AND finished_at IS NOT NULL AND rolled_back_at IS NULL" 2>/dev/null || true)" = 1 ]; then
            exec psql -v directus_password="$$DIRECTUS_SHOP_DB_PASSWORD" -f /directus-shop-init.sql
          fi
          sleep 2
        done
        echo 'Catalog migration did not complete; check the web service logs.' >&2
        exit 1
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  directus-shop:
    profiles: [admin]
    build:
      context: .
      dockerfile: directus/Dockerfile
    ports:
      - '127.0.0.1:8058:8055'
    environment:
      SECRET: ${DIRECTUS_SHOP_SECRET:-local-only-change-shop-directus-secret}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-BlueformLocal123!}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: blueform
      DB_USER: blueform_directus_shop
      DB_PASSWORD: ${DIRECTUS_SHOP_DB_PASSWORD:-local-only-directus-shop-password}
      PUBLIC_URL: http://localhost:8058
    volumes:
      - directus_shop_uploads:/directus/uploads
      - ./client/public:/blueform-static:ro
    depends_on:
      directus-shop-init:
        condition: service_completed_successfully

  directus-shop-config:
    profiles: [admin]
    image: node:24-bookworm-slim
    environment:
      DIRECTUS_URL: http://directus-shop:8055
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-BlueformLocal123!}
    volumes:
      - ./scripts/configure-directus-shop.mjs:/configure-directus-shop.mjs:ro
    command: ['node', '/configure-directus-shop.mjs']
    depends_on:
      directus-shop:
        condition: service_started

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'

  blackbox:
    profiles: [observability]
    image: prom/blackbox-exporter:v0.27.0
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  postgres-exporter:
    profiles: [observability]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: db:5432/blueform?sslmode=disable
      DATA_SOURCE_USER: blueform
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  cadvisor:
    profiles: [observability]
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  node-exporter:
    profiles: [observability]
    image: prom/node-exporter:v1.9.1
    command: ['--path.rootfs=/host']
    volumes:
      - /:/host:ro

  loki:
    profiles: [observability]
    image: grafana/loki:3.5.5
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.10.2
    command: ['run', '--storage.path=/var/lib/alloy', '/etc/alloy/config.alloy']
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-BlueformLocal123!}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  web_node_modules:
  postgres_data:
  s3_data:
  directus_db_data:
  directus_uploads:
  directus_shop_uploads:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
