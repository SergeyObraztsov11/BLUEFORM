global:
  scrape_interval: 15s
scrape_configs:
  - job_name: blueform-apps
    static_configs:
      - targets: ['web:3000', 'api:3001']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3000/', 'http://api:3001/api/ready', 'http://directus:8055/server/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
